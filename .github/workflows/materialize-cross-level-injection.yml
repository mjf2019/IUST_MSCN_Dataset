name: Materialize cross-level injection

on:
  push:
    branches:
      - revision/adaptive-cdr-mlc-final
    paths:
      - CDR_MLC/inject_cross_level_in_place.py
      - .github/workflows/materialize-cross-level-injection.yml

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/adaptive-cdr-mlc-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inject 20 percent from both other levels
        run: python CDR_MLC/inject_cross_level_in_place.py --fraction 0.20
      - name: Commit integrated Clean-Valid files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CDR_MLC/DATASETS/CDR-MLC/Clean_Valid
          git commit -m "Materialize 20% cross-level injection in Clean-Valid"
          git push origin HEAD:revision/adaptive-cdr-mlc-final
